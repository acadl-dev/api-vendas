# Configuracoes do fornecedores-service, centralizadas no Config Server.
# Este arquivo e' lido pelo config-server a partir do repositorio Git
# e servido ao fornecedores-service quando ele sobe (spring.config.import=configserver:...).
#
# OBS: o enunciado pede a porta 8084 para este servico, mas 8084 ja esta
# ocupada pelo auth-service (config-repo/auth-service.properties e
# docker-compose.yml). Para nao gerar conflito ao rodar os dois juntos,
# o fornecedores-service usa a porta 8086.

server.port=8086

# H2 em memoria
spring.datasource.url=jdbc:h2:mem:fornecedoresdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2, acessivel em http://localhost:8086/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Registro no Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
